<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول </title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="style.css">
   
</head>

<body >
     <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">نظام تسجيل الطلاب</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="القائمة">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
              
             
                  <button  id="theme-toggle" class="nav-link text" role="button"></button>

                </li>
            </ul>
        </div>
    </div>
</nav>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <header class="text-center mb-4">
                    <h1 class="h3 fw-bold page-title">تسجيل الدخول</h1>
                    <p >أهلاً وسهلاً! سجل الدخول للوصول إلى نظام إدارة الطلاب.</p>
                </header>

                <main>

                    <div id="login-message" class="alert alert-danger text-center mb-4" role="alert" hidden></div>

                    <form action="login.php" method="POST">

                        <div class="mb-3">
                            <label for="login" class="form-label fw-semibold">اسم المستخدم أو البريد الإلكتروني</label>
                            <input
                                type="text"
                                class="form-control"
                                id="login"
                                name="login"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">كلمة المرور</label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary btn-submit w-100">تسجيل الدخول</button>

                    </form>

                </main>

              

            </div>
        </div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");

    const messages = {
        empty: "يرجى ملء جميع الحقول المطلوبة.",
        invalid: "اسم المستخدم أو البريد الإلكتروني أو كلمة المرور غير صحيحة.",
        server: "تعذّر تسجيل الدخول، يرجى المحاولة مرة أخرى."
    };

    const messageElement = document.getElementById("login-message");

    if (error && messages[error]) {
        messageElement.textContent = messages[error];
        messageElement.hidden = false;

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );
    }

});
</script>
 <script src="theme.js"></script>
</body>

</html>
